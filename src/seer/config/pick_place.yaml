seer_data_collector:
  ros__parameters:
    exp_id: 0                     # 실험 ID, 폴더 이름은 4자리 (0000). 사람·세션마다 다르게
    object_body: obj_box_01
    marker_body: place_marker     # 놓을 위치를 표시하는 body (에피소드마다 무작위 배치)
    instruction: "Pick up the blue cube and place it on the red marker."
    output_dir: ~/multipanda_ws/data/seer_episodes   # = Seer의 root_dir/real_dataset_names
    num_episodes: 3
    start_index: 0
    record_rate: 15.0             # 기록 주기 (Hz)
    open_thresh: 0.07             # 그리퍼 폭이 이보다 크면 열림(1), 아니면 닫힘(-1). 열림 0.08, 큐브 잡으면 약 0.06
    idle_thresh: 0.0005           # 위치 delta가 이보다 작고 그리퍼 명령도 그대로인 스텝은 제거 (Seer filter_real_data 기준)
    min_steps: 15                 # 남은 스텝이 이보다 적으면 저장 안 함 (Seer 학습 window = 7 + 3)
    object_reset_z: 0.061         # 큐브를 놓는 높이 (테이블 위 1 cm)
    # 시작 구역 중심 [x1, y1, x2, y2, ...] (MuJoCo world, m), 에피소드마다 순서대로 사용
    # 5 x 8 격자 (한 칸 9 cm): 큐브 중심 x -0.80 ~ -0.35, y -0.36 ~ 0.36
    # x > -0.35 (베이스 쪽)와 x < -0.80 (먼 모서리)는 도달 불가라 제외
    start_zones: [-0.755, -0.315, -0.755, -0.225, -0.755, -0.135, -0.755, -0.045, -0.755, 0.045, -0.755, 0.135, -0.755, 0.225, -0.755, 0.315,
                  -0.665, -0.315, -0.665, -0.225, -0.665, -0.135, -0.665, -0.045, -0.665, 0.045, -0.665, 0.135, -0.665, 0.225, -0.665, 0.315,
                  -0.575, -0.315, -0.575, -0.225, -0.575, -0.135, -0.575, -0.045, -0.575, 0.045, -0.575, 0.135, -0.575, 0.225, -0.575, 0.315,
                  -0.485, -0.315, -0.485, -0.225, -0.485, -0.135, -0.485, -0.045, -0.485, 0.045, -0.485, 0.135, -0.485, 0.225, -0.485, 0.315,
                  -0.395, -0.315, -0.395, -0.225, -0.395, -0.135, -0.395, -0.045, -0.395, 0.045, -0.395, 0.135, -0.395, 0.225, -0.395, 0.315]
    start_zone_half: 0.045        # 구역 반폭 (m), 구역 안에서 무작위
    # 마커도 start_zones 격자를 사용 (무작위 순서, 40칸을 한 번씩 쓰면 다시 섞음)
    # 마커 중심 범위 [x_min, x_max, y_min, y_max] (MuJoCo world, m): 도달 가능 + 마커(10 cm)가 테이블 안
    marker_range: [-0.80, -0.35, -0.35, 0.35]
    marker_z: 0.0205              # 마커 높이 (테이블 윗면 바로 위)
    min_marker_dist: 0.12         # 큐브 중심과 마커 중심 최소 거리 (m), 큐브가 마커 위에서 시작하지 않도록
    result_timeout: 60.0          # 한 에피소드 최대 대기 (s)
    stop_on_failure: false
